{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4">
      <h4>📸 Daily check-in — {{ today }}</h4>
      <p class="text-muted">Snap a photo of your finished homework so the group knows you're done for today.</p>
      <form method="post" enctype="multipart/form-data">
        <div class="mb-3">
          <label class="form-label">Photo</label>
          <input class="form-control" type="file" name="photo" accept="image/*" capture="environment" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Note (optional)</label>
          <input class="form-control" name="note" placeholder="e.g. finished math + bio reading">
        </div>
        <button class="btn btn-success w-100" type="submit">Submit check-in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
