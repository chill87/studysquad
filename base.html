<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StudySquad{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f6f7fb; }
    .navbar-brand { font-weight: 700; letter-spacing: -0.5px; }
    .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,0.08); border-radius: 14px; }
    .thumb { width: 100%; max-height: 220px; object-fit: cover; border-radius: 10px; }
    .checkin-badge { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; }
    .subject-pill { font-size: .75rem; }
  </style>
</head>
<body>
  {% if session.get('username') %}
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom mb-4">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('dashboard') }}">📚 StudySquad</a>
      <div class="d-flex gap-3 align-items-center">
        <a class="nav-link d-inline" href="{{ url_for('dashboard') }}">Dashboard</a>
        <a class="nav-link d-inline" href="{{ url_for('calendar_view') }}">Calendar</a>
        <a class="nav-link d-inline" href="{{ url_for('checkin') }}">Check In</a>
        <span class="text-muted small">Hi, {{ session['username'] }}</span>
        <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('logout') }}">Switch name</a>
      </div>
    </div>
  </nav>
  {% endif %}

  <div class="container pb-5">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}
          <div class="alert alert-info">{{ m }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
